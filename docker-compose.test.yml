services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: resource_tracker_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d resource_tracker_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@db-test:5432/resource_tracker_test
      OPENAI_API_KEY: test-key-placeholder
      OPENAI_MODEL: gpt-4o-mini
      JWT_SECRET_KEY: test-secret-key-for-testing-only-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: '["http://localhost:3000"]'
      MAX_UPLOAD_SIZE_MB: "10"
      UPLOAD_DIR: /tmp/test-uploads
    depends_on:
      db-test:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             pytest tests/ -v --tb=short --cov=app --cov-report=term-missing"
    volumes:
      - ./backend:/app
    profiles:
      - test
