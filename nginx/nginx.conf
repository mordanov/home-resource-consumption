worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zone: 10 requests/minute per IP for login endpoint
    # 10m shared memory = ~160 000 IP entries
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # PDF export route — streaming response, disable buffering, long timeout
        location /api/v1/exports/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Bill upload — LLM parsing latency, extended timeout
        location /api/v1/bills/upload {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Login rate limiting — 10 req/min per IP, burst of 5 allowed without delay
        # Returns 429 on excess (R-003 brute-force mitigation)
        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
            proxy_connect_timeout 10s;
        }

        # General API proxy
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
            proxy_connect_timeout 10s;
        }

        # Frontend proxy
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 15s;
            proxy_connect_timeout 10s;
        }
    }
}
