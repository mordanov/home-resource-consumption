name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_HOME_RESOURCES_DIR: ${{ secrets.VPS_HOME_RESOURCES_DIR }}
          VPS_WEB_FOLDERS_DIR: ${{ secrets.VPS_WEB_FOLDERS_DIR }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$REPO' '$REF_NAME' '$VPS_HOME_RESOURCES_DIR' '$VPS_WEB_FOLDERS_DIR'" << 'EOF'

          set -e

          REPO="$1"
          REF_NAME="$2"
          HOME_RESOURCES_DIR="${3:-$HOME/home-resource-consumption}"
          WEB_FOLDERS_DIR="${4:-$HOME/web-folders}"

          PREVIOUS_COMMIT=""

          # --- Update home-resource-consumption repo ---
          mkdir -p "$HOME_RESOURCES_DIR"
          cd "$HOME_RESOURCES_DIR"

          if [ ! -d .git ]; then
            git clone "https://github.com/$REPO.git" .
          fi

          PREVIOUS_COMMIT=$(git rev-parse HEAD || echo "")

          git fetch origin --prune
          git checkout "$REF_NAME"
          git reset --hard "origin/$REF_NAME"

          # --- Update web-folders infra repo ---
          if [ ! -d "$WEB_FOLDERS_DIR/.git" ]; then
            echo "web-folders repo is missing at $WEB_FOLDERS_DIR"
            echo "Clone web-folders on VPS once, then rerun deployment"
            exit 1
          fi

          cd "$WEB_FOLDERS_DIR"
          PREVIOUS_WEB_FOLDERS_COMMIT=$(git rev-parse HEAD || echo "")
          git fetch origin --prune

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout main
            git reset --hard origin/main
          else
            git pull --ff-only
          fi

          # --- Rebuild shared stack from web-folders ---
          cd "$WEB_FOLDERS_DIR"

          if ! docker compose config --services | grep -qx "home-resources-backend"; then
            echo "web-folders config is outdated: home-resources-backend service not found"
            echo "Update web-folders on VPS to include home-resources services and retry deployment"
            exit 1
          fi

          HOME_RESOURCES_HTTP_HOST="${HOME_RESOURCES_PRIMARY_DOMAIN:-home-resources.mainpage.com}"

          debug_dump() {
            docker compose ps || true
            docker compose logs --no-color --tail=200 home-resources-backend || true
            docker compose logs --no-color --tail=200 home-resources-frontend || true
            docker compose logs --no-color --tail=200 nginx || true
            docker compose logs --no-color --tail=200 recipes-db || true
          }

          wait_for_home_resources_health() {
            local retries=60
            local delay=2

            echo "Waiting for home-resources service via nginx (Host: ${HOME_RESOURCES_HTTP_HOST})..."
            for ((i=1; i<=retries; i++)); do
              if curl -fsS -H "Host: ${HOME_RESOURCES_HTTP_HOST}" http://localhost/api/v1/health > /dev/null 2>&1; then
                echo "Health check passed"
                return 0
              fi
              sleep "$delay"
            done

            echo "Health check failed after $((retries * delay))s"
            return 1
          }

          echo "Building containers..."
          docker compose build home-resources-backend home-resources-frontend nginx
          docker compose up -d --remove-orphans

          if ! wait_for_home_resources_health; then
            echo "Health check failed -> rollback"
            debug_dump

            if [ -n "$PREVIOUS_COMMIT" ]; then
              cd "$HOME_RESOURCES_DIR"
              git reset --hard "$PREVIOUS_COMMIT"
              cd "$WEB_FOLDERS_DIR"
              docker compose build home-resources-backend home-resources-frontend nginx
              docker compose up -d --remove-orphans

              if wait_for_home_resources_health; then
                echo "Rollback recovered service successfully"
              else
                echo "Rollback completed, but service is still unhealthy"
                debug_dump
              fi
            fi

            exit 1
          fi

          docker compose ps
          EOF

      - name: Deploy notification
        if: success()
        run: echo "✅ Deployment to ${{ secrets.VPS_HOST }} completed successfully!"

      - name: Deploy failed notification
        if: failure()
        run: echo "❌ Deployment failed!"

# --- Required GitHub Secrets (Settings -> Secrets and variables -> Actions) ---
# VPS_SSH_KEY            - Private SSH key for deployment server access
# VPS_HOST               - Deployment server hostname or IP
# VPS_USER               - SSH username on deployment server
# VPS_PORT               - SSH port (default: 22)
# VPS_HOME_RESOURCES_DIR - Path to home-resource-consumption repo on VPS
# VPS_WEB_FOLDERS_DIR    - Path to web-folders repo on VPS
#
# Runtime app vars are stored in web-folders/.env on VPS (not in GitHub secrets):
# HOME_RESOURCES_PRIMARY_DOMAIN, HOME_RESOURCES_SERVER_NAMES
# HOME_RESOURCES_POSTGRES_DB, HOME_RESOURCES_POSTGRES_USER, HOME_RESOURCES_POSTGRES_PASSWORD
# HOME_RESOURCES_OPENAI_API_KEY, HOME_RESOURCES_OPENAI_MODEL
# HOME_RESOURCES_JWT_SECRET_KEY, HOME_RESOURCES_JWT_ALGORITHM
# HOME_RESOURCES_ACCESS_TOKEN_EXPIRE_MINUTES, HOME_RESOURCES_REFRESH_TOKEN_EXPIRE_DAYS
# HOME_RESOURCES_MAX_UPLOAD_SIZE_MB, HOME_RESOURCES_CORS_ORIGINS
# HOME_RESOURCES_DEFAULT_USER_USERNAME, HOME_RESOURCES_DEFAULT_USER_EMAIL, HOME_RESOURCES_DEFAULT_USER_PASSWORD


